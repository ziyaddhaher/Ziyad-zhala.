<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Story</title>
    <style>
        :root {
            --primary: #ff477e;
            --primary-bg: #ffe5ec;
            --text-color: #4a4a4a;
        }
        
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1, #ffb3c6);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
            user-select: none;
            cursor: pointer;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(255, 71, 126, 0.25);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            z-index: 10;
            width: 85%;
            max-width: 380px;
            transform: translateY(0);
            transition: all 0.5s ease;
            animation: fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .main-heart {
            font-size: 70px;
            color: var(--primary);
            animation: pulse 1s infinite alternate ease-in-out;
            display: inline-block;
            margin-bottom: 15px;
            filter: drop-shadow(0 5px 10px rgba(255, 71, 126, 0.3));
        }

        @keyframes pulse {
            to { transform: scale(1.2); filter: drop-shadow(0 0 20px #ff477e); }
        }

        h1 {
            color: var(--primary);
            font-size: 2.4rem;
            margin: 10px 0;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .subtitle {
            color: var(--text-color);
            font-size: 1.15rem;
            font-weight: 500;
            margin-bottom: 30px;
            border-right: 3px solid var(--primary);
            white-space: nowrap;
            overflow: hidden;
            width: 100%;
            animation: typing 4s steps(35, end) infinite alternate;
        }

        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }

        .counter-box {
            background: linear-gradient(135deg, #ff477e, #ff7096);
            color: white;
            padding: 20px 15px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 71, 126, 0.35);
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }

        .counter-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.15), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite linear;
        }

        @keyframes shine {
            0% { transform: translate(-30%, -30%) rotate(45deg); }
            100% { transform: translate(30%, 30%) rotate(45deg); }
        }

        .days-number {
            font-size: 3.2rem;
            font-weight: 800;
            display: block;
            line-height: 1;
            margin-bottom: 5px;
        }

        .days-label {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.95;
        }

        .music-status {
            font-size: 0.9rem;
            color: var(--primary);
            font-weight: bold;
            background: rgba(255, 71, 126, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-5px); }
            60% { transform: translateY(-3px); }
        }

        .floating-heart {
            position: absolute;
            color: rgba(255, 71, 126, 0.45);
            animation: floatUp linear infinite;
            bottom: -50px;
            pointer-events: none;
        }

        @keyframes floatUp {
            to {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop preload="auto">
        <source src="music.mp3" type="audio/mpeg">
        <source src="music.m4a" type="audio/mp4">
    </audio>

    <div class="card" id="loveCard">
        <div class="main-heart">❤️</div>
        <h1>Ziyad & Pari</h1>
        <div class="subtitle">تۆ جوانترین ڕووداوی ژیانی منیت...</div>
        
        <div class="counter-box">
            <span class="days-number">146</span>
            <span class="days-label">ڕۆژ پێکەوەین</span>
        </div>

        <div class="music-status" id="statusText">
            ✨ دەست لە شاشەکە بدە بۆ لێدانی مۆسیقا
        </div>
    </div>

    <script>
        const music = document.getElementById('bgMusic');
        const statusText = document.getElementById('statusText');
        let hasPlayed = false;

        document.body.addEventListener('click', () => {
            if (!hasPlayed) {
                playAudio();
            } else {
                toggleAudio();
            }
        });

        function playAudio() {
            music.play().then(() => {
                hasPlayed = true;
                statusText.innerHTML = '🎵 مۆسیقای ڕەسەن لێدەدات...';
                statusText.style.background = 'rgba(71, 255, 146, 0.15)';
                statusText.style.color = '#2a9d8f';
            }).catch(err => {
                console.log("Autoplay blocked:", err);
                statusText.innerHTML = '❌ کێشەیەک لە فایلەکەدا هەیە';
            });
        }

        function toggleAudio() {
            if (music.paused) {
                music.play();
                statusText.innerHTML = '🎵 مۆسیقای ڕەسەن لێدەدات...';
            } else {
                music.pause();
                statusText.innerHTML = '⏸️ مۆسیقا ڕاگرێم چاوەڕێی تۆم';
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = Math.random() * 22 + 12 + 'px';
            heart.style.animationDuration = Math.random() * 3 + 4 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }
        setInterval(createHeart, 300);
    </script>
</body>
</html>
